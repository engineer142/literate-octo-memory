name: proxy-sync

on:
  schedule:
    # Раз в 40 минут — с запасом над реальным временем прогона (см. фикс
    # UV_THREADPOOL_SIZE ниже), чтобы новый тик никогда не вставал в
    # очередь позади ещё не завершившегося предыдущего.
    - cron: '*/40 * * * *'
  workflow_dispatch: {} # ручной запуск из вкладки Actions, для отладки

permissions:
  contents: write # нужно, чтобы job мог закоммитить data/*.json обратно в репо

concurrency:
  group: proxy-sync
  cancel-in-progress: false # не обрываем прогон, если следующий тик подоспел раньше

jobs:
  sync:
    runs-on: ubuntu-latest
    # Настоящий верхний предел даёт check.js сам (жёсткий таймер, см. код) —
    # этот timeout-minutes только подстраховка на случай, если что-то
    # застрянет ДО или ПОСЛЕ самого check.js (collect/push/commit).
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Collect candidates
        run: node scripts/collect.js
        env:
          # Нужен для GitHub Code Search (самопополнение списка источников)
          # и для более щедрого лимита запросов к api.github.com вообще.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check liveness (Obfuscated2 / Fake-TLS ping)
        run: node scripts/check.js
        env:
          # КЛЮЧЕВОЙ фикс: по умолчанию Node резолвит DNS через всего 4
          # потока в libuv-тредпуле — с 1000+ уникальных хостов это узкое
          # место сериализует почти всю работу, несмотря на CHECK_CONCURRENCY.
          # Поднимаем тредпул, чтобы DNS-резолвинг реально шёл параллельно.
          UV_THREADPOOL_SIZE: '128'
          CHECK_CONCURRENCY: '30'
          CHECK_TIMEOUT_MS: '3000'
          # Вернули 2 попытки — раньше было снижено до 1 из-за проблем со
          # скоростью, но с фиксом сокетов прогон укладывается в ~1 минуту
          # даже на 1200+ кандидатов, так что запас по времени есть.
          CHECK_ATTEMPTS: '2'
          # Жёсткий верхний предел (см. hardTimer в check.js) — скрипт
          # гарантированно завершится и запишет частичный результат сам,
          # не дожидаясь убийства процесса извне. Подняли с 10 до 12 минут —
          # потолок кандидатов снят, кандидатов в моменте может стать больше.
          CHECK_WALL_CLOCK_BUDGET_MS: '720000'

      - name: Push results to Firestore (siteConfig/proxyAuto)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/push-firestore.js

      - name: Commit results
        run: |
          git config user.name "proxy-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/candidates.json data/checked.json data/discovered-sources.json
          if git diff --cached --quiet; then
            echo "Изменений нет, коммит пропущен"
          else
            git commit -m "sync: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          fi
