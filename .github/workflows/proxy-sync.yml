name: proxy-sync

on:
  schedule:
    # Раз в 30 минут (компромисс между скоростью нахождения новых прокси
    # и расходом минут Actions — см. обсуждение). GitHub не гарантирует
    # точное время срабатывания, возможны задержки в 5-15 мин при нагрузке.
    - cron: '*/30 * * * *'
  workflow_dispatch: {} # ручной запуск из вкладки Actions, для отладки

permissions:
  contents: write # нужно, чтобы job мог закоммитить data/*.json обратно в репо

concurrency:
  group: proxy-sync
  cancel-in-progress: false # не обрываем прогон, если следующий тик подоспел раньше

jobs:
  sync:
    runs-on: ubuntu-latest
    # Полная проверка ~1000-2000 кандидатов при конкурентности 40 и 2
    # попытках на мёртвый сервер (~5с таймаут каждая) может занять
    # 10-15+ минут — оставляем запас.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Collect candidates
        run: node scripts/collect.js

      - name: Check liveness (Obfuscated2 / Fake-TLS ping)
        run: node scripts/check.js
        env:
          CHECK_CONCURRENCY: '40'
          CHECK_TIMEOUT_MS: '5000'
          CHECK_ATTEMPTS: '2'

      # TODO: следующий шаг после того, как check.js станет настоящим:
      # - name: Push diff to Firestore
      #   env:
      #     FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      #   run: node scripts/push-firestore.js

      - name: Commit results
        run: |
          git config user.name "proxy-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/candidates.json data/checked.json
          if git diff --cached --quiet; then
            echo "Изменений нет, коммит пропущен"
          else
            git commit -m "sync: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          fi
